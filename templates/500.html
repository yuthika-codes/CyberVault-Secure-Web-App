{% extends "base.html" %}

{% block title %}500 - Server Error | CyberVault{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <i class="fa-solid fa-bug text-danger display-1 mb-3"></i>
        <h1 class="display-4 font-weight-bold text-danger">500</h1>
        <h2>Internal Server Error</h2>
        <p class="mt-3">An unexpected security exception occurred. Our engine is reviewing the log stream.</p>

        <div class="mt-4">
            <a href="{{ url_for('home') }}" class="btn">
                <i class="fa-solid fa-house me-2"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
