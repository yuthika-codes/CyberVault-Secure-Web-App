{% extends "base.html" %}

{% block title %}404 - Page Not Found | CyberVault{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>
        <h1 class="display-4 font-weight-bold text-cyan">404</h1>
        <h2>Page Not Found</h2>

        <div class="mt-4">
            <a href="{{ url_for('home') }}" class="btn">

            </a>
        </div>
    </div>
</div>
{% endblock %}
